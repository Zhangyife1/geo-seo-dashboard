name: Daily GEO Data Crawl

on:
  schedule:
    # 每天 UTC 03:00 执行 = 北京时间 11:00
    - cron: '0 3 * * *'
  workflow_dispatch:
    # 支持手动触发（在 Actions 页面点击 Run workflow）

jobs:
  crawl-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          cd pipeline
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run crawler (API-first + browser fallback)
        run: |
          cd pipeline
          python run_crawler.py --mode auto
        continue-on-error: true
        env:
          # API Keys (从 GitHub Secrets 读取)
          # 配置方法: GitHub仓库 → Settings → Secrets and variables → Actions → New repository secret
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          QIANFAN_SECRET_KEY: ${{ secrets.QIANFAN_SECRET_KEY }}
          VOLC_API_KEY: ${{ secrets.VOLC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        # 爬虫可能因网络/反爬失败，失败时不中断工作流

      - name: Export data to JSON
        run: |
          cd pipeline
          python export_data.py

      - name: Upload screenshots on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-screenshots
          path: pipeline/data/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/data/dashboard_data.json
          git diff --staged --quiet || (
            git commit -m "chore: update GEO data $(date +%Y-%m-%d)"
            git push
          )
